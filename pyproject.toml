[project]
name = "indicorderbench"
version = "0.1.0"
description = "Catches multilingual voice agents placing the wrong order. A τ-bench style benchmark for voice ordering in Indian languages."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Kaushik Reddy Lingireddy"}]
keywords = ["voice-agents", "benchmark", "evaluation", "hinglish", "indic", "livekit", "tool-calling"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "typer>=0.12",
  "jinja2>=3.1",
  "httpx>=0.27",
]

[project.optional-dependencies]
audio = ["numpy>=1.26", "soundfile>=0.12"]

[project.scripts]
iob = "indicorderbench.cli:app"

[project.urls]
Homepage = "https://github.com/Lingikaushikreddy/indicorderbench"
Repository = "https://github.com/Lingikaushikreddy/indicorderbench"
Issues = "https://github.com/Lingikaushikreddy/indicorderbench/issues"
Changelog = "https://github.com/Lingikaushikreddy/indicorderbench/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/indicorderbench"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"  # bundles packs/starter without *.wav clips

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "numpy>=1.26",
  "soundfile>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:indicorderbench.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["docs", "*.md", "packs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["indicorderbench"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["soundfile", "soundfile.*"]
ignore_missing_imports = true
