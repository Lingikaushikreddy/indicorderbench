id: hien_cancellation_04
title: Place ke baad cancel, phir naya order
language: hi-en
category: cancellation
menu: starter_qsr
difficulty: hard
tags: [cancel-after-submit, reorder, multi-turn]
review_status: unreviewed
reviewer_notes: "Model pre-review 2026-10-01: reads natural, turns unchanged; clarification patterns now need a question mark and the spice rule also matches 'kitni teekhi' (biryani is feminine). Native check: whether a caller would open the new order with 'uski jagah'."
caller:
  turns:
    - id: t1
      text: "Ek dal makhani aur do butter naan, bas."
      is_closing: true
    - id: t2
      text: "Yeh order cancel kar do, mann badal gaya."
    - id: t3
      text: "Ek veg biryani de do, bas itna hi."
      is_closing: true
  clarifications:
    - id: confirm_first
      match: ["order (place )?kar d(oo|u)n", "confirm kar[^.!?]*\\?", "place kar d(oo|u)n"]
      reply: {text: "Haan, order place kar do."}
      max_uses: 1
    - id: pakka_cancel
      match: ["pakka cancel[^.!?]*\\?", "poora order cancel\\?", "cancel kar d(oo|u)n\\?"]
      reply: {text: "Haan, cancel kar do."}
      max_uses: 1
    - id: teekha
      match: ["kitn[aei] teekh[aei][^.!?]*\\?", "teekh[aei]\\?", "spice level\\?"]
      reply: {text: "Medium."}
      max_uses: 1
expected:
  - id: biryani_only
    description: Only the veg biryani order is active
    orders:
      - lines:
          - {item_id: veg_biryani, quantity: 1}
