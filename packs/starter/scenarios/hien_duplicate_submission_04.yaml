id: hien_duplicate_submission_04
title: Lambi chuppi, status check, phir "place kar do"
language: hi-en
category: duplicate_submission
menu: starter_qsr
difficulty: hard
tags: [long-pause, status-check, multi-turn]
review_status: unreviewed
reviewer_notes: "Model pre-review 2026-10-01: reads natural, turns unchanged; clarification patterns now need a question mark. Native check: 'Sun rahe ho?' (informal) vs 'Sun rahe hain?' or 'Aawaz aa rahi hai?' to restaurant staff."
caller:
  turns:
    - id: t1
      text: "Ek butter chicken aur do butter naan, bas itna hi."
      is_closing: true
    - id: t2
      text: "Hello? Sun rahe ho? Mera order ho gaya kya?"
    - id: t3
      text: "Theek hai, order place kar do."
  clarifications:
    - id: confirm_first
      match: ["order (place )?kar d(oo|u)n", "confirm kar[^.!?]*\\?", "place kar d(oo|u)n"]
      reply: {text: "Haan, order place kar do."}
      max_uses: 1
    - id: teekha
      match: ["kitn[aei] teekh[aei][^.!?]*\\?", "teekh[aei]\\?", "spice level\\?"]
      reply: {text: "Medium."}
      max_uses: 1
    - id: kitne_naan
      match: ["kitn[ei] (butter )?naan[^.!?]*\\?", "naan kitn[ei][^.!?]*\\?"]
      reply: {text: "Do naan."}
      max_uses: 1
expected:
  - id: once
    description: Exactly one active order with butter chicken and two naans
    orders:
      - lines:
          - {item_id: butter_chicken, quantity: 1}
          - {item_id: butter_naan, quantity: 2}
