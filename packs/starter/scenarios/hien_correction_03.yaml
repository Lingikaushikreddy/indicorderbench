id: hien_correction_03
title: Readback ke baad teekha kam
language: hi-en
category: correction
menu: starter_qsr
difficulty: medium
tags: [modifier-correction, after-readback, multi-turn]
review_status: unreviewed
reviewer_notes: "Model pre-review 2026-10-01: reads natural, turns unchanged; clarification patterns now need a question mark. Native check: 'kam teekha kar do' vs the arguably more idiomatic 'teekha kam kar do', which the parser would read as spicy (needs a 'teekha kam' mild alias first)."
caller:
  turns:
    - id: t1
      text: "Ek chicken wrap, zyada teekha."
    - id: t2
      text: "Actually, kam teekha kar do."
  clarifications:
    - id: teekha
      match: ["kitn[aei] teekh[aei][^.!?]*\\?", "teekh[aei]\\?", "spice level\\?", "kam ya zyada[^.!?]*\\?"]
      reply: {text: "Kam teekha."}
      max_uses: 2
    - id: pyaaz
      match: ["(pyaaz|onion)[^.!?]*\\?"]
      reply: {text: "Pyaaz ke saath theek hai."}
      max_uses: 1
expected:
  - id: mild_wrap
    description: One chicken wrap at mild spice
    orders:
      - lines:
          - {item_id: chicken_wrap, quantity: 1, modifiers: {spice: mild}}
