id: hien_correction_02
title: Veg biryani ki jagah chicken biryani
language: hi-en
category: correction
menu: starter_qsr
difficulty: medium
tags: [item-swap, multi-turn]
review_status: unreviewed
reviewer_notes: "Model pre-review 2026-10-01: reads natural, turns unchanged; clarification patterns now need a question mark. Native check: a caller may shorten the swap to 'veg ki jagah chicken kar do'."
caller:
  turns:
    - id: t1
      text: "Ek veg biryani."
    - id: t2
      text: "Sorry, veg biryani ki jagah chicken biryani kar do."
  clarifications:
    - id: konsi_biryani
      match: ["k(o|au)nsi biryani[^.!?]*\\?", "veg ya chicken[^.!?]*\\?", "chicken ya veg[^.!?]*\\?"]
      reply: {text: "Chicken biryani."}
      max_uses: 2
    - id: teekha
      match: ["kitn[aei] teekh[aei][^.!?]*\\?", "teekh[aei]\\?", "spice level\\?"]
      reply: {text: "Medium."}
      max_uses: 1
expected:
  - id: chicken_only
    description: One chicken biryani and no veg biryani
    orders:
      - lines:
          - {item_id: chicken_biryani, quantity: 1}
