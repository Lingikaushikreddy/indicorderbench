id: en_duplicate_submission_01
title: Closing phrased twice
language: en-IN
category: duplicate_submission
menu: starter_qsr
difficulty: easy
tags: [smoke, closing-twice]
review_status: unreviewed
reviewer_notes: null
caller:
  turns:
    - id: t1
      text: "One masala chai, that's all."
      is_closing: true
    - id: t2
      text: "Yes, that's it, thanks."
      is_closing: true
  clarifications:
    - id: confirm_first
      match: ["shall i (place|confirm)", "place (the|your) order\\?", "should i place"]
      reply: {text: "Yes, please place the order."}
      max_uses: 1
    - id: sugar
      match: ["sugar\\?", "how much sugar"]
      reply: {text: "Normal sugar."}
      max_uses: 1
    - id: how_many
      match: ["how many"]
      reply: {text: "Just one."}
      max_uses: 1
expected:
  - id: one_chai_once
    description: Exactly one active order with one masala chai
    orders:
      - lines:
          - {item_id: masala_chai, quantity: 1}
