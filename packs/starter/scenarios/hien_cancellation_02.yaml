id: hien_cancellation_02
title: Ek line hata do
language: hi-en
category: cancellation
menu: starter_qsr
difficulty: medium
tags: [remove-line, multi-turn]
review_status: unreviewed
reviewer_notes: "Model pre-review 2026-10-01: 'Do samosa' -> 'Do samose' (Hindi plural) and 'Chai hata do' -> 'Chai rehne do'; clarification patterns now need a question mark. Native check: that 'chai rehne do' unambiguously means drop the chai here (it literally reads 'let the chai be')."
caller:
  turns:
    - id: t1
      text: "Do samose aur ek masala chai."
    - id: t2
      text: "Chai rehne do."
  clarifications:
    - id: konsa_item
      match: ["k(o|au)nsa item[^.!?]*\\?", "k(o|au)nsa hata[^.!?]*\\?", "chai ya samos[^.!?]*\\?"]
      reply: {text: "Chai."}
      max_uses: 2
    - id: cheeni
      match: ["cheeni\\?", "sugar\\?", "kitni cheeni[^.!?]*\\?"]
      reply: {text: "Normal cheeni."}
      max_uses: 1
expected:
  - id: samosas_only
    description: Two samosas and no chai
    orders:
      - lines:
          - {item_id: samosa, quantity: 2}
