id: hien_quantity_03
title: Chaar naan, do dal makhani aur ek gulab jamun
language: hi-en
category: quantity
menu: starter_qsr
difficulty: medium
tags: [number-words, above-two, three-items]
review_status: unreviewed
reviewer_notes: "Model pre-review 2026-10-01: reads natural, turn unchanged; clarification patterns now need a question mark and accept 'kitni' or 'kitne' with naan and dal. Native check: 'do dal makhani' vs 'do plate dal makhani'."
caller:
  turns:
    - id: t1
      text: "Chaar butter naan aur do dal makhani, aur ek gulab jamun bhi."
  clarifications:
    - id: kitne_naan
      match: ["kitn[ei] (butter )?naan[^.!?]*\\?", "naan kitn[ei][^.!?]*\\?"]
      reply: {text: "Chaar naan."}
      max_uses: 2
    - id: kitni_dal
      match: ["kitn[ie] dal[^.!?]*\\?", "dal (makhani )?kitn[ie][^.!?]*\\?"]
      reply: {text: "Do dal makhani."}
      max_uses: 2
    - id: kitne_jamun
      match: ["kitne gulab[^.!?]*\\?", "gulab jamun kitne[^.!?]*\\?"]
      reply: {text: "Ek gulab jamun."}
      max_uses: 2
expected:
  - id: family_order
    description: Four naans, two dal makhani and one gulab jamun
    orders:
      - lines:
          - {item_id: butter_naan, quantity: 4}
          - {item_id: dal_makhani, quantity: 2}
          - {item_id: gulab_jamun, quantity: 1}
