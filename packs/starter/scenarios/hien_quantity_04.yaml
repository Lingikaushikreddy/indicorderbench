id: hien_quantity_04
title: Digits do turns mein
language: hi-en
category: quantity
menu: starter_qsr
difficulty: medium
tags: [digits, multi-turn, two-items]
review_status: unreviewed
reviewer_notes: "Model pre-review 2026-10-01: reads natural, turns unchanged; singular 'samosa' after the digit kept as a deliberate variant ('samose' is used in quantity_02, cancellation_02 and duplicate_submission_03); clarification patterns now need a question mark. Native check: '3 samosa' vs '3 samose'."
caller:
  turns:
    - id: t1
      text: "Mujhe 2 cold coffee chahiye."
    - id: t2
      text: "Aur 3 samosa bhi daal dena."
  clarifications:
    - id: kitni_coffee
      match: ["kitn[ie] (cold )?coffee[^.!?]*\\?", "coffee kitn[ie][^.!?]*\\?"]
      reply: {text: "Do cold coffee."}
      max_uses: 2
    - id: kitne_samosa
      match: ["kitne samos[^.!?]*\\?", "samos[ae] kitne[^.!?]*\\?"]
      reply: {text: "Teen samosa."}
      max_uses: 2
    - id: cheeni
      match: ["cheeni\\?", "sugar\\?", "kitni cheeni[^.!?]*\\?"]
      reply: {text: "Normal cheeni."}
      max_uses: 1
expected:
  - id: coffees_and_samosas
    description: Two cold coffees and three samosas
    orders:
      - lines:
          - {item_id: cold_coffee, quantity: 2}
          - {item_id: samosa, quantity: 3}
