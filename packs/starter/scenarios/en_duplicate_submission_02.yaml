id: en_duplicate_submission_02
title: Confirm after the order is placed
language: en-IN
category: duplicate_submission
menu: starter_qsr
difficulty: medium
tags: [confirm-after-placed]
review_status: unreviewed
reviewer_notes: null
caller:
  turns:
    - id: t1
      text: "A cold coffee and a gulab jamun, that's it."
      is_closing: true
    - id: t2
      text: "Yes, confirm the order please."
  clarifications:
    - id: confirm_first
      match: ["shall i (place|confirm)", "place (the|your) order\\?", "should i place"]
      reply: {text: "Yes, please place the order."}
      max_uses: 1
    - id: sugar
      match: ["sugar\\?", "how much sugar"]
      reply: {text: "Normal sugar."}
      max_uses: 1
    - id: how_many
      match: ["how many"]
      reply: {text: "One each."}
      max_uses: 1
expected:
  - id: once
    description: Exactly one active order with a coffee and a gulab jamun
    orders:
      - lines:
          - {item_id: cold_coffee, quantity: 1}
          - {item_id: gulab_jamun, quantity: 1}
