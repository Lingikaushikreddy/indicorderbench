# Starter QSR menu: 12 items across wraps, mains, sides, drinks and desserts, with Hinglish
# aliases. Aliases are matched as whole-word phrases after normalisation, longest first.
id: starter_qsr
name: Starter QSR menu
currency: INR
modifier_groups:
  - id: onion
    name: Onion
    exclusive: true
    default: with_onion
    options:
      - id: with_onion
        name: With onion
        aliases: [with onion, with onions, pyaaz ke saath]
      - id: no_onion
        name: No onion
        aliases:
          - no onion
          - no onions
          - without onion
          - without onions
          - bina pyaaz
          - bina onion
          - pyaaz nahi
          - onion nahi
          - pyaaz mat dalna
          - onion mat dalna
          - pyaaz ke bina
  - id: spice
    name: Spice level
    exclusive: true
    default: medium
    options:
      - id: mild
        name: Mild
        aliases: [mild, less spicy, not spicy, less spice, mild spice, kam teekha, kam mirchi]
      - id: medium
        name: Medium
        aliases: [medium, medium spicy, medium spice, medium teekha, normal spice]
      - id: spicy
        name: Spicy
        aliases:
          - spicy
          - extra spicy
          - very spicy
          - teekha
          - zyada teekha
          - bahut teekha
          - extra teekha
          - spicy wala
  - id: extras
    name: Extras
    exclusive: false
    options:
      - id: extra_cheese
        name: Extra cheese
        price_delta: 30
        aliases: [extra cheese, with cheese, add cheese, cheese zyada, zyada cheese, cheese daal ke]
      - id: extra_paneer
        name: Extra paneer
        price_delta: 40
        aliases: [extra paneer, paneer zyada, zyada paneer]
  - id: sugar
    name: Sugar
    exclusive: true
    default: normal_sugar
    options:
      - id: normal_sugar
        name: Normal sugar
        aliases: [normal sugar, regular sugar, with sugar, normal cheeni, cheeni ke saath]
      - id: less_sugar
        name: Less sugar
        aliases: [less sugar, half sugar, light sugar, kam sugar, kam cheeni, kam meetha, thodi cheeni]
      - id: no_sugar
        name: No sugar
        aliases:
          - no sugar
          - without sugar
          - sugar free
          - sugarless
          - bina sugar
          - sugar nahi
          - bina cheeni
          - cheeni nahi
          - cheeni mat dalna
          - bina shakkar
          - shakkar nahi
items:
